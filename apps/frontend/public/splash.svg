  <path d="M0 432 88 356 168 408 258 322 352 406 432 350 518 412 606 336 698 402 792 348 900 416 900 600 0 600Z" fill="url(#ridge-far)" opacity="0.92" />
  <path d="M0 486 108 412 208 468 318 396 420 472 530 406 640 470 758 416 900 482 900 600 0 600Z" fill="url(#ridge-mid)" />
  <path d="M0 548 138 482 262 536 392 470 522 540 660 482 782 536 900 498 900 600 0 600Z" fill="url(#ridge-near)" />
