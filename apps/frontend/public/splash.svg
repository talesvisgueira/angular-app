  <circle cx="450" cy="345" r="190" fill="url(#glow)" />
  <circle cx="450" cy="345" r="72" fill="url(#sun)" />

  <g stroke="#1b2153" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M560 240q9-10 18 0q9-10 18 0" />
    <path d="M620 210q7-8 14 0q7-8 14 0" />
