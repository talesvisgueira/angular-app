    <circle cx="210" cy="150" r="1.5" opacity="0.6" />
    <circle cx="330" cy="70" r="2.2" opacity="0.8" />
    <circle cx="430" cy="120" r="1.4" opacity="0.5" />
    <circle cx="540" cy="60" r="2" opacity="0.85" />
    <circle cx="660" cy="110" r="1.6" opacity="0.6" />
    <circle cx="770" cy="70" r="2.3" opacity="0.9" />
    <circle cx="840" cy="160" r="1.5" opacity="0.55" />
    <circle cx="90" cy="220" r="1.6" opacity="0.5" />
    <circle cx="640" cy="200" r="1.4" opacity="0.45" />
    <circle cx="720" cy="250" r="1.3" opacity="0.4" />
