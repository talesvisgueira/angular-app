<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Paisagem estilizada de montanhas ao entardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2153" />
      <stop offset="0.55" stop-color="#4147c4" />
      <stop offset="1" stop-color="#8f9ff5" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.85" />
      <stop offset="0.45" stop-color="#ff9d5c" stop-opacity="0.32" />
      <stop offset="1" stop-color="#ff9d5c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8a8" />
      <stop offset="1" stop-color="#ff9e57" />
    </linearGradient>
    <linearGradient id="ridge-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4ab8" />
      <stop offset="1" stop-color="#2b3390" />
    </linearGradient>
    <linearGradient id="ridge-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28308d" />
      <stop offset="1" stop-color="#1c2368" />
    </linearGradient>
    <linearGradient id="ridge-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171d52" />
      <stop offset="1" stop-color="#0f1440" />
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#sky)" />

  <g fill="#fff">
