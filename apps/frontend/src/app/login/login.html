<main class="login-page">
  <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <h1>Entrar</h1>
    <p class="subtitle">Acesse sua conta para continuar</p>

    <label class="field">
      <span>E-mail</span>
      <input
        type="email"
        formControlName="email"
        placeholder="voce@exemplo.com"
        autocomplete="email"
      />
      @if (email.touched && email.hasError('required')) {
        <small class="error">Informe o e-mail.</small>
      } @else if (email.touched && email.hasError('email')) {
        <small class="error">E-mail inválido.</small>
      }
    </label>

    <label class="field">
      <span>Senha</span>
      <input
        type="password"
        formControlName="password"
        placeholder="••••••"
        autocomplete="current-password"
      />
      @if (password.touched && password.hasError('required')) {
        <small class="error">Informe a senha.</small>
      } @else if (password.touched && password.hasError('minlength')) {
        <small class="error">A senha deve ter ao menos 6 caracteres.</small>
      }
    </label>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>

    @if (error()) {
      <p class="error-box" role="alert">{{ error() }}</p>
    }
  </form>
</main>
